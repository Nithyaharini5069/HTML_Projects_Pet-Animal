<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom</title>
<style>
body{
background-color: black;
}
.outer{
background-color: blanchedalmond;
height:460px;
width:500px;
position: relative;
top: 20px;
left: 50px;
border-radius: 10px;
box-shadow: 10px 10px 10px red;
display:flex;
flex-direction: column;
align-items: center;
}
.img1,.img2,.img3,.img4{
height:80px;
width:80px;
border-radius:100px;
display: block;
margin-top:10px;
}
.num1,.num2,.num3,.num4{
width: 40%;
text-align: center;
margin-top:10px;
background-color: blue;
color:white;
height:25px;
line-height:25px;
border-radius:5px;
}
.btn1,.btn2,.btn3,.btn4{
width:40%;
height:30px;
margin-top:5px;
}
.head{
text-align:center;
color: aliceblue;
font-size:xx-large;
margin-bottom:20px;
}
@media screen and (max-width:500px){
.outer{
width:90%;
left:5%;
top:20px;
padding-bottom:20px;
}
.img1,.img2,.img3,.img4{
width:60px;
height:60px;
}
.num1,.num2,.num3,.num4,.btn1,.btn2,.btn3,.btn4{
width:60%;
}
}
</style>
</head>
<body>
<p class="head"><b>Pet Animals</b></p>
<div class="outer">
<img src="./cat.jpg" class="img1"/>
<p class="num1">0</p>
<button class="btn1">Cat</button>
<img src="./hen.jpg" class="img2"/>
<p class="num2">0</p>
<button class="btn2">Hen</button>
<img src="./sheep.jpg" class="img3"/>
<p class="num3">0</p>
<button class="btn3">Sheep</button>
<img src="./dog.jpg" class="img4"/>
<p class="num4">0</p>
<button class="btn4">Dog</button>
</div>
<script>
let catBtn=document.querySelector(".btn1");
let henBtn=document.querySelector(".btn2");
let sheepBtn=document.querySelector(".btn3");
let dogBtn=document.querySelector(".btn4");
let catNum=document.querySelector(".num1");
let henNum=document.querySelector(".num2");
let sheepNum=document.querySelector(".num3");
let dogNum=document.querySelector(".num4");
let catCount=0,henCount=0,sheepCount=0,dogCount=0,totalCount=0;
catBtn.addEventListener("click",function(){
if(totalCount<50){catCount++;totalCount++;catNum.innerText=catCount;}});
henBtn.addEventListener("click",function(){
if(totalCount<50){henCount++;totalCount++;henNum.innerText=henCount;}});
sheepBtn.addEventListener("click",function(){
if(totalCount<50){sheepCount++;totalCount++;sheepNum.innerText=sheepCount;}});
dogBtn.addEventListener("click",function(){
if(totalCount<50){dogCount++;totalCount++;dogNum.innerText=dogCount;}});
</script>
</body>
</html>
